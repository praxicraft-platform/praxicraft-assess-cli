name: auto-release

# When CLI source changes land on main, bump patch version in package.json,
# update CHANGELOG.md, tag, and trigger the release workflow via the tag push.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      !startsWith(github.event.head_commit.message, 'chore(release):')
      && !contains(github.event.head_commit.message, '[skip release]')
      && github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          RAW="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$RAW"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          NOTES="$(git log "${LATEST}..HEAD" --pretty=format:'- %s' --no-merges | sed '/^chore(release):/d' || true)"
          if [ -z "$NOTES" ]; then
            NOTES="- Maintenance release."
          fi
          {
            echo "latest=${LATEST}"
            echo "next=${NEXT}"
            echo "version=${NEXT#v}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump package.json and CHANGELOG
        env:
          NEXT: ${{ steps.ver.outputs.next }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: ${{ steps.ver.outputs.NOTES }}
        run: |
          set -euo pipefail
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version=process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "
          TMP="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "## ${VERSION}"
            echo
            echo "${NOTES}"
            echo
            tail -n +2 CHANGELOG.md | sed -n '/^## /,$p'
          } > "$TMP"
          mv "$TMP" CHANGELOG.md

      - name: Commit, tag, and push
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): ${NEXT}"
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin HEAD:main
          git push origin "${NEXT}"
