version: 2

project_name: praxicraft-assess

before:
  hooks:
    - go mod tidy

builds:
  - id: praxicraft-assess
    main: ./cmd/praxicraft-assess
    binary: praxicraft-assess
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/praxicraft-platform/praxicraft-assess-cli/internal/cmdroot.Version={{.Version}}
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
